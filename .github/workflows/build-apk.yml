name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by latest sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Android SDK metadata for legacy AGP
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          find "$SDK_ROOT" -type f \( -name 'repository2-*.xml' -o -name 'repository.xml' -o -name '*.xml' \) | while read -r file; do
            [ -f "$file" ] || continue
            sed -i \
              -e 's/<api-level>\([0-9][0-9]*\)x<\/api-level>/<api-level>\1<\/api-level>/g' \
              -e 's/<api-level>\([0-9][0-9]*\)\.[0-9][0-9]*<\/api-level>/<api-level>\1<\/api-level>/g' \
              -e '/<extension-level>[0-9.][^<]*<\/extension-level>/d' \
              "$file"
          done

      - name: Set up JDK 8 (required by Gradle 4.4 / AGP 3.1.3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
